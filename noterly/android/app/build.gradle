plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// INFO: app signing and keystore
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "uk.co.tdsstudios.noterly"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        // INFO: required for flutter_local_notifications plugin, when minSdkVersion < 20
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "uk.co.tdsstudios.noterly"


        minSdkVersion 36 // Personal use: Galaxy S26 Ultra / S22 Ultra (Android 16+) only
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // Target devices (Galaxy S26 Ultra / S22 Ultra) are 64-bit ARM only
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false // INFO: unsure if this needs to be false or not
            // Without key.properties, sign with the local debug key so a personal release build installs over the
            // debug build already on the phone without uninstalling it (same signature, data kept)
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    flavorDimensions "default"

    productFlavors {
        dev {
            dimension "default"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "Noterly Dev"
            manifestPlaceholders = [appName: "Noterly Dev"]
        }
        production {
            dimension "default"
            applicationId "uk.co.tdsstudios.noterly"
            resValue "string", "app_name", "Noterly"
            manifestPlaceholders = [appName: "Noterly"]
        }
    }


}

flutter {
    source '../..'
}

dependencies {
    // INFO: needed to prevent desugaring error for flutter_local_notifications plugin
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // INFO: needed to prevent Android 12L crash for flutter_local_notifications plugin
    implementation 'androidx.window:window:1.5.0'
    implementation 'androidx.window:window-java:1.5.0'
}
